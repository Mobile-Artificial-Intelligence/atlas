# Atlas is fully offline: the APK must never hold network permissions.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults to built-in Kotlin + the new DSL; we keep the classic KGP setup
# because the vendored BeeRouter core is a KMP module written for
# kotlin("multiplatform") + com.android.library. These opt-outs are documented
# in vendor/beerouter/VENDORING.md.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official