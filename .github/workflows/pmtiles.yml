name: PMTiles

# Builds OpenMapTiles-schema PMTiles archives from Geofabrik extracts with
# the SAME pinned Planetiler (0.10.2) and arguments used to mint the original
# atlas australia.pmtiles — Atlas's import, search, and routing pipelines are
# calibrated against exactly this output (MVT tiles, gzip, z0-14).
#
# Every region — monaco included — is one matrix entry under the `countries`
# job, and every workflow run builds the full matrix: a manual dispatch
# produces exactly what the daily schedule produces, so artifacts from every
# run are complete.
#
# canada and united-states as whole-country extracts blow the 6h hosted-job
# cap (6.0 / 11.3 GB pbf), so they are split along Geofabrik's own regional
# extracts: canada/* into its 13 provinces and territories, us/* into its 51
# states, DC, and territories. Geofabrik's coarser US groupings (us-south
# 3.8 GB, us-west 3.2 GB) still exceed the cap — great-britain at 2.0 GB is
# already borderline — so the states are the finest split that fits. Every
# split entry is <=1.4 GB pbf, on par with great-britain. The cost is matrix
# volume (~70 entries) and one archive per region instead of one per country;
# the app installs each region's archive independently, nothing else changes.
#
# After Planetiler, regions with an oa_cc merge OpenAddresses address points
# into the archive (one file to download, one search index over it): the
# felt/tippecanoe fork's tile-join clips the OA archive to z14, drops the
# bulk properties, renames its `data` layer to `address`, joins it with the
# base, and the header's geography block (which tile-join widens to the
# whole world) is patched back to the base's — the app bounds its tile
# sweeps by the archive bbox. GB, monaco, and the US states carry no address
# layer — search there stays place/POI (GB: no OA data exists; monaco: none
# either — the sg code it once carried merged Singapore's addresses into a
# Monaco archive, dead tiles the bbox patch then hid; US: no countrywide
# archive, 2295 per-source files would blow the cap even split by state).
#
# After the archive, each leg replays the app's own graph build over the
# file it just produced — every 5° bucket the bbox touches, via the same
# graphBuildCli Gradle task that proves the device heap — and uploads the
# segments dir as the `atlas-routing-<region>` artifact alongside the map
# archive (upload-artifact zips the dir, so the artifact zip carries the
# .rd5s at its root — Installing that zip in the app, Settings → Install
# routing data, which runs adoptPrebuiltSegments, gives instant routing:
# no ~50-minute on-device build). The manifest pins the archive
# fingerprint, so routing data only adopts against the archive from the
# same run — the two artifacts are a pair. This runs INSIDE the region's
# leg, right after the archive upload: routing for a region must not
# wait out the slowest sibling's archive build, and the archive is
# already on disk — no artifact re-download.
#
# The search index gets the same treatment: searchIndexCli replays the app's
# own indexing pass over the archive and uploads the `atlas-search-<region>`
# artifact (index DB + completion marker + manifest, root-level in the zip —
# Settings → Load search index / the import dialog's third row, which runs
# adoptPrebuiltIndex, turns the minutes-to-hours post-import address sweep
# into a copy). Its manifest pins the same archive fingerprint — three
# artifacts, one pair-check, all from the same run.
#
# The final `summarize` job indexes every artifact the run produced into
# the run's Summary tab (name, size, download link).
#
# Hosted-runner reality check (2026-09 calibration: 0.9 GB australia pbf ->
# 1.3 GB pmtiles, ~1h45m on a fast dev machine; a 4-vcpu runner is slower):
#   monaco / small states/provinces  -> minutes
#   new-zealand   0.4 GB pbf -> fits comfortably
#   australia     0.9 GB pbf -> fits
#   great-britain 2.0 GB pbf -> borderline against the 6h hosted-job cap
#   canada-* max  nunavut 1.4 GB pbf -> GB-scale, fits (coastline-heavy, the
#     pbf overstates its node count)
#   us-* max      california 1.2 GB pbf -> GB-scale, fits
on:
  schedule:
    # Daily at midnight UTC, when Geofabrik's daily updates are ready.
    - cron: '0 0 * * *'
  workflow_dispatch:

# No concurrency block: runs are independent by design — every trigger
# starts immediately, overlapping in-flight runs included. All outputs are
# per-run namespaced (artifacts, summary, caches), so nothing collides.
jobs:
  countries:
    name: pmtiles-${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      # One region failing (disk, timeout) must not kill the others.
      fail-fast: false
      # 8 concurrent legs: the split put ~70 entries on the matrix, most of
      # them minutes-long — 5 would stretch a run past twice that. Well
      # inside both the 20-job free-plan limit and Geofabrik's tolerance.
      max-parallel: 8
      matrix:
        region: ["monaco", "new-zealand", "australia", "great-britain", "malaysia-singapore-brunei"]
        # oa_cc: the region's OpenAddresses code — empty means the region
        #   gets no address merge.
        # oa_clip: when set (minlon,minlat,maxlon,maxlat), the OA archive is
        #   clipped to this bbox before the merge. Required for the canada-*
        #   split: the ca countrywide archive covers the whole country, and
        #   tile-join unions its inputs' tile coverage — unclipped, every
        #   province archive would carry every other province's address
        #   tiles. Bboxes are deliberately generous: an under-covering clip
        #   silently drops edge address tiles, while the overlap is empty
        #   ocean/tundra that costs nothing.
        # address_at: a city center whose z14 tile must carry the merged
        #   address layer — the verify step's proof the merge landed. Every
        #   province with an address_at has an OpenAddresses source covering
        #   that city (nunavut has no OA sources at all).
        include:
          - region: monaco
            url: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
            heap: 2g
            free_disk: false
            oa_cc: ''
            oa_clip: ''
            address_at: ''
          - region: new-zealand
            url: https://download.geofabrik.de/australia-oceania/new-zealand-latest.osm.pbf
            heap: 6g
            free_disk: false
            oa_cc: nz
            oa_clip: ''
            address_at: "174.7645,-36.8509"
          - region: australia
            url: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
            heap: 8g
            free_disk: false
            oa_cc: au
            oa_clip: ''
            address_at: "144.9631,-37.8142"
          - region: great-britain
            url: https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
            heap: 10g
            free_disk: false
            oa_cc: ''
            oa_clip: ''
            address_at: ''
          - region: malaysia-singapore-brunei
            # Geofabrik has no standalone Singapore extract — the trio comes
            # as one 238 MB file (a lone `asia/singapore-...` URL 302s to the
            # homepage, whose HTML then dies in Planetiler). The sg
            # countrywide addresses still cover the city-state's tiles.
            url: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
            heap: 2g
            free_disk: false
            oa_cc: sg
            oa_clip: ''
            address_at: "103.8495,1.2900"

          # ── Canada: 13 provinces/territories ────────────────────────────
          # The ca countrywide OpenAddresses archive is clipped to each
          # province's bbox (oa_clip) before the merge.
          - {region: canada-alberta, url: "https://download.geofabrik.de/north-america/canada/alberta-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-120.1,48.9,-109.9,60.1", address_at: "-114.0719,51.0447"}
          - {region: canada-british-columbia, url: "https://download.geofabrik.de/north-america/canada/british-columbia-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-141.0,48.2,-113.9,60.1", address_at: "-123.1207,49.2827"}
          - {region: canada-manitoba, url: "https://download.geofabrik.de/north-america/canada/manitoba-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-102.1,48.9,-88.8,60.1", address_at: "-97.1385,49.8951"}
          - {region: canada-new-brunswick, url: "https://download.geofabrik.de/north-america/canada/new-brunswick-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-67.8,44.9,-63.5,48.2", address_at: "-64.7951,46.0975"}
          - {region: canada-newfoundland-and-labrador, url: "https://download.geofabrik.de/north-america/canada/newfoundland-and-labrador-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-68.0,46.5,-52.3,60.8", address_at: "-52.7121,47.5312"}
          - {region: canada-northwest-territories, url: "https://download.geofabrik.de/north-america/canada/northwest-territories-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-137.0,59.8,-100.0,79.0", address_at: "-114.3718,62.4540"}
          - {region: canada-nova-scotia, url: "https://download.geofabrik.de/north-america/canada/nova-scotia-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-67.2,43.2,-59.5,47.2", address_at: "-63.5756,44.6488"}
          - {region: canada-nunavut, url: "https://download.geofabrik.de/north-america/canada/nunavut-latest.osm.pbf", heap: 10g, free_disk: false, oa_cc: ca, oa_clip: "-125.0,59.5,-55.0,84.0", address_at: ''}
          - {region: canada-ontario, url: "https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-95.5,41.5,-78.8,57.2", address_at: "-79.3832,43.6532"}
          - {region: canada-prince-edward-island, url: "https://download.geofabrik.de/north-america/canada/prince-edward-island-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-64.8,45.4,-61.8,47.3", address_at: "-63.1311,46.2360"}
          - {region: canada-quebec, url: "https://download.geofabrik.de/north-america/canada/quebec-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-80.2,44.9,-56.2,62.8", address_at: "-73.5674,45.5019"}
          - {region: canada-saskatchewan, url: "https://download.geofabrik.de/north-america/canada/saskatchewan-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-110.1,48.9,-101.9,60.1", address_at: "-104.6067,50.4498"}
          - {region: canada-yukon, url: "https://download.geofabrik.de/north-america/canada/yukon-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: ca, oa_clip: "-141.1,59.9,-123.9,70.1", address_at: "-135.0565,60.7247"}

          # ── United States: 50 states + DC + territories ─────────────────
          # No address merge: OpenAddresses has no US countrywide archive
          # and its 2295 per-source files would blow the cap even split.
          - {region: us-alabama, url: "https://download.geofabrik.de/north-america/us/alabama-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-alaska, url: "https://download.geofabrik.de/north-america/us/alaska-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-arizona, url: "https://download.geofabrik.de/north-america/us/arizona-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-arkansas, url: "https://download.geofabrik.de/north-america/us/arkansas-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-california, url: "https://download.geofabrik.de/north-america/us/california-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-colorado, url: "https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-connecticut, url: "https://download.geofabrik.de/north-america/us/connecticut-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-delaware, url: "https://download.geofabrik.de/north-america/us/delaware-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-district-of-columbia, url: "https://download.geofabrik.de/north-america/us/district-of-columbia-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-florida, url: "https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
