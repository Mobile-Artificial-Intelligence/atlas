          - {region: us-massachusetts, url: "https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-michigan, url: "https://download.geofabrik.de/north-america/us/michigan-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-minnesota, url: "https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-mississippi, url: "https://download.geofabrik.de/north-america/us/mississippi-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-missouri, url: "https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-montana, url: "https://download.geofabrik.de/north-america/us/montana-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-nebraska, url: "https://download.geofabrik.de/north-america/us/nebraska-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-nevada, url: "https://download.geofabrik.de/north-america/us/nevada-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-new-hampshire, url: "https://download.geofabrik.de/north-america/us/new-hampshire-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-new-jersey, url: "https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
