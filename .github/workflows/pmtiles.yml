          - {region: us-pennsylvania, url: "https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
          - {region: us-puerto-rico, url: "https://download.geofabrik.de/north-america/us/puerto-rico-latest.osm.pbf", heap: 8g, free_disk: false, oa_cc: '', oa_clip: '', address_at: ''}
