name: PMTiles

# Builds OpenMapTiles-schema PMTiles archives from Geofabrik country extracts
# with the SAME pinned Planetiler (0.10.2) and arguments used to mint the
# original atlas australia.pmtiles — Atlas's import, search, and routing
# pipelines are calibrated against exactly this output (MVT tiles, gzip,
# z0-14).
#
# Every country — monaco included — is one matrix entry under the `countries`
# job, and every workflow run builds the full matrix: a manual dispatch
# produces exactly what the daily schedule produces, so artifacts from every
# run are complete.
#
# After Planetiler, countries with an oa_cc merge OpenAddresses address
# points into the archive (one file to download, one search index over it):
# the felt/tippecanoe fork's tile-join clips the OA archive to z14, drops
# the bulk properties, renames its `data` layer to `address`, joins it with
# the base, and the header's geography block (which tile-join widens to the
# whole world) is patched back to the base's — the app bounds its tile
# sweeps by the archive bbox. GB (closed address data) and US (2295
# per-source files, no countrywide) carry no address layer — search there
# stays place/POI.
#
# After the archive, each leg replays the app's own graph build over the
# file it just produced — every 5° bucket the bbox touches, via the same
# graphBuildCli Gradle task that proves the device heap — and uploads the
# segments dir as the `atlas-routing-<country>` artifact alongside the map
# archive (upload-artifact zips the dir, so the artifact zip carries the
# .rd5s at its root — Installing that zip in the app, Settings → Install
# routing data, which runs adoptPrebuiltSegments, gives instant routing:
# no ~50-minute on-device build). The manifest pins the archive
# fingerprint, so routing data only adopts against the archive from the
# same run — the two artifacts are a pair. This runs INSIDE the country's
# leg, right after the archive upload: routing for a country must not
# wait out the slowest sibling's archive build, and the archive is
# already on disk — no artifact re-download.
#
# The search index gets the same treatment: searchIndexCli replays the app's
# own indexing pass over the archive and uploads the `atlas-search-<country>`
# artifact (index DB + completion marker + manifest, root-level in the zip —
# Settings → Load search index / the import dialog's third row, which runs
# adoptPrebuiltIndex, turns the minutes-to-hours post-import address sweep
# into a copy). Its manifest pins the same archive fingerprint — three
# artifacts, one pair-check, all from the same run.
#
# The final `summarize` job indexes every artifact the run produced into
# the run's Summary tab (name, size, download link).
#
# Hosted-runner reality check (2026-09 calibration: 0.9 GB australia pbf ->
# 1.3 GB pmtiles, ~1h45m on a fast dev machine; a 4-vcpu runner is slower):
#   new-zealand   0.4 GB pbf -> fits comfortably
#   australia     0.9 GB pbf -> fits
#   great-britain 2.0 GB pbf -> borderline against the 6h hosted-job cap
#   canada        6.0 GB pbf -> will likely hit the 6h cap
#   united-states 11.3 GB pbf -> will hit the 6h cap (needs a larger or
#     self-hosted runner — the disk math fits after freeing ~30 GB, the
#     wall-clock does not)
on:
  schedule:
    # Daily at midnight UTC, when Geofabrik's daily updates are ready.
    - cron: '0 0 * * *'
  workflow_dispatch:

# No concurrency block: runs are independent by design — every trigger
# starts immediately, overlapping in-flight runs included. All outputs are
# per-run namespaced (artifacts, summary, caches), so nothing collides.
jobs:
  countries:
    name: pmtiles-${{ matrix.country }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      # One country failing (disk, timeout) must not kill the others.
      fail-fast: false
      max-parallel: 5
      matrix:
        country: ["monaco", "new-zealand", "australia", "great-britain", "canada", "united-states", "malaysia-singapore-brunei"]
        # oa_cc: the country's OpenAddresses code — empty means the country
        #   gets no address merge (GB: no OA data exists; US: no countrywide
        #   archive, 2295 per-source files would blow the 6h cap).
        # address_at: a city center whose z14 tile must carry the merged
        #   address layer — the verify step's proof the merge landed.
        include:
          - country: monaco
            url: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
            heap: 2g
            free_disk: false
            oa_cc: sg
            address_at: "103.8495,1.2900"
          - country: new-zealand
            url: https://download.geofabrik.de/australia-oceania/new-zealand-latest.osm.pbf
            heap: 6g
            free_disk: false
            oa_cc: nz
            address_at: "174.7645,-36.8509"
          - country: australia
            url: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
            heap: 8g
            free_disk: false
            oa_cc: au
            address_at: "144.9631,-37.8142"
          - country: great-britain
            url: https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
            heap: 10g
            free_disk: false
            oa_cc: ''
            address_at: ''
          - country: canada
            url: https://download.geofabrik.de/north-america/canada-latest.osm.pbf
            heap: 12g
            free_disk: true
            oa_cc: ca
            address_at: "-79.3832,43.6532"
          - country: united-states
            url: https://download.geofabrik.de/north-america/us-latest.osm.pbf
            heap: 12g
            free_disk: true
            oa_cc: ''
            address_at: ''
          - country: malaysia-singapore-brunei
            # Geofabrik has no standalone Singapore extract — the trio comes
            # as one 238 MB file (a lone `asia/singapore-...` URL 302s to the
            # homepage, whose HTML then dies in Planetiler). The sg
            # countrywide addresses still cover the city-state's tiles.
            url: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
            heap: 2g
            free_disk: false
            oa_cc: sg
            address_at: "103.8495,1.2900"

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.free_disk
        run: |
          # ubuntu-latest ships ~14 GB free; the two multi-GB extracts need
          # more than that. The Android SDK (~9 GB), .NET, and Haskell
          # toolchains are dead weight for this job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Planetiler's aux sources (lake centerlines, water polygons, natural
      # earth) never change for a given release — cache them so only the OSM
      # extract downloads fresh each run.
      - name: Cache Planetiler sources
        uses: actions/cache@v4
        with:
          path: data/sources
          key: planetiler-sources-0.10.2

      - name: Fetch Planetiler
        run: |
          wget -q https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar -O planetiler.jar
          VER=$(unzip -p planetiler.jar META-INF/maven/com.onthegomap.planetiler/planetiler-core/pom.properties | grep -o 'version=.*' | cut -d= -f2)
          test "$VER" = "0.10.2" || { echo "unexpected planetiler version: $VER"; exit 1; }

      - name: Download extract
        run: |
          mkdir -p data/sources out
          bash .github/scripts/fetch-extract.sh \
               "${{ matrix.url }}" \
               "data/sources/${{ matrix.country }}.osm.pbf"

      - name: Build PMTiles
        run: |
          java -Xmx${{ matrix.heap }} -jar planetiler.jar \
            --osm_path="data/sources/${{ matrix.country }}.osm.pbf" \
            --output="out/atlas-${{ matrix.country }}.pmtiles" \
            --tmpdir="data/tmp" \
            --download \
            --force
          # Free the pbf before the address merge — the extract is the
          # single biggest disk consumer and the archive is already written.
          rm -f "data/sources/${{ matrix.country }}.osm.pbf"

      - name: Cache tile-join build
        if: matrix.oa_cc != ''
        uses: actions/cache@v4
        with:
          path: tippecanoe
          key: tippecanoe-2.79.0-ubuntu-latest

      # The mapbox tippecanoe can't read or write PMTiles; the felt fork's
      # tile-join can do both, which is what makes the one-file merge
      # possible without an mbtiles round-trip.
      # tile-join 2.79 rejects --version (exit 101) — "can I run it" is
      # proved by the usage banner instead.
      - name: Build tile-join
        if: matrix.oa_cc != ''
        run: |
          if [ -x tippecanoe/tile-join ]; then
            usage=$(tippecanoe/tile-join 2>&1 || true)
            if echo "$usage" | grep -q "Usage:"; then
              echo "tile-join restored from cache"
              exit 0
            fi
            echo "cached tile-join is broken; rebuilding"
          fi
          sudo apt-get install -y -qq libsqlite3-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git
          make -C tippecanoe -j"$(nproc)" tile-join
          usage=$(tippecanoe/tile-join 2>&1 || true)
          echo "$usage" | grep -q "Usage:" || { echo "tile-join build failed"; exit 1; }

      - name: Fetch OpenAddresses
        if: matrix.oa_cc != ''
        run: python3 .github/scripts/fetch-openaddresses.py "${{ matrix.oa_cc }}" out/oa

      - name: Merge address layer
        if: matrix.oa_cc != ''
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          mv "out/atlas-$COUNTRY.pmtiles" "out/atlas-$COUNTRY-base.pmtiles"
          # Clip the OA archive(s) to z14 (the only zoom the app indexes
          # the address layer at) and drop the bulk properties (accuracy,
          # hash, id, postcode, ...) — search reads number/street/unit/city
          # only. au/countrywide alone adds ~14M features at this step.
          tippecanoe/tile-join -Z14 -z14 -y number -y street -y unit -y city -pk \
            -o out/addr-z14.pmtiles out/oa/*.pmtiles
          # -R renames the OA `data` layer to the `address` layer the app's
          # search indexer reads; zoom flags are per-invocation, so the base
          # needs its own join without them.
          tippecanoe/tile-join -R data:address -pk \
            -o "out/atlas-$COUNTRY.pmtiles" "out/atlas-$COUNTRY-base.pmtiles" out/addr-z14.pmtiles
          # tile-join widens the bbox to its inputs' union (the OA archive's
          # own header is global); the app bounds its tile sweeps with the
          # archive bbox (its z14 address sweep enumerates the bbox's tile
          # grid), so it must stay the base's.
          python3 .github/scripts/patch-pmtiles-bbox.py \
            "out/atlas-$COUNTRY-base.pmtiles" "out/atlas-$COUNTRY.pmtiles"
          # The intermediates are the archive's size all over again — free
          # them before the upload.
          rm -f "out/atlas-$COUNTRY-base.pmtiles" out/addr-z14.pmtiles

      - name: Verify PMTiles
        env:
          COUNTRY: ${{ matrix.country }}
          ADDRESS_AT: ${{ matrix.address_at }}
        run: |
          if [ -n "$ADDRESS_AT" ]; then
            # --address-at= (not --address-at with a space): canada's
            # ADDRESS_AT starts with a minus (-79.38…), which argparse
            # would otherwise read as an unknown option.
            python3 .github/scripts/verify-pmtiles.py "out/atlas-$COUNTRY.pmtiles" --address-at="$ADDRESS_AT"
          else
            python3 .github/scripts/verify-pmtiles.py "out/atlas-$COUNTRY.pmtiles"
          fi

      - name: Upload PMTiles
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pmtiles-${{ matrix.country }}
          # Tiles are already gzip-compressed inside the archive; storing
          # beats re-deflating multiple GiB.
          compression-level: 0
          retention-days: 7
          path: out/atlas-${{ matrix.country }}.pmtiles
          if-no-files-found: error

      # ── Prebuilt routing ZIP ─────────────────────────────────────────
      # The archive is on disk right here; build the routing buckets while
      # the runner still holds them (see the header comment). The archive
      # build ran under Java 21 for Planetiler; graphBuildCli is proven
      # under 17, so switch the toolchain for the rest of this leg. Legs
      # with free_disk: true deleted the preinstalled Android SDK to make
      # room for the extract — setup-android puts one back for AGP.
      - name: Setup Java 17 for graphBuildCli
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The paths must be $GITHUB_WORKSPACE-absolute: the graphBuildCli
      # JavaExec's working dir is the :app module dir (the CLI's profiles2
      # lookup depends on that cwd), so a relative -Parchive would resolve
      # against app/ and never find the archive.
      #
      # -Pbucket=all walks the archive's bbox; each finished bucket leaves a
      # .rd5 (or .empty marker), so a retry over a PERSISTENT out dir — a
      # local CLI run or a self-hosted runner — only pays for the buckets it
      # never reached. A hosted retry starts with an empty workspace and
      # rebuilds from scratch.
      #
      # No -Pzip: the out dir IS the artifact. The all-mode leaves
      # manifest.json in it, and upload-artifact zips the dir — the
      # artifact zip then carries the .rd5s at its root, exactly what the
      # app's Install routing data picker expects. A minted ZIP would just
      # nest a zip inside the artifact zip, one level out of the app's
      # reach.
      - name: Build routing buckets
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          ./gradlew :app:graphBuildCli \
            -Parchive="$GITHUB_WORKSPACE/out/atlas-$COUNTRY.pmtiles" \
            -Pbucket=all \
            -Pout="$GITHUB_WORKSPACE/out/segments" \
            -Pheap=4g
          # Resume markers, not artifact content: the manifest already
          # carries the empty list, and the provenance marker is meaningless
          # outside this workspace (a retry starts from an empty one).
          rm -f "$GITHUB_WORKSPACE/out/segments"/*.empty \
                "$GITHUB_WORKSPACE/out/segments/build-fingerprint.txt"

      - name: Show routing segments
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          # End-to-end proof the dir is adoptable: the manifest names this
          # very archive and its bucket list parses.
          cat "out/segments/manifest.json"
          echo '---'
          ls "out/segments" | tail -3

      - name: Upload routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-routing-${{ matrix.country }}
          # The .rd5 segments are dense binary; storing beats re-deflating.
          compression-level: 0
          retention-days: 7
          # The dir, not a zip: upload-artifact zips these into the
          # artifact, root-level, which is the layout adoptPrebuiltSegments
          # parses.
          path: out/segments/*
          if-no-files-found: error

      # ── Prebuilt search index ────────────────────────────────────────
      # The search counterpart of the routing leg: the SAME SearchIndexer
      # pass the device's import runs, minted here while the archive is
      # still on disk (Room's identity hash is target-independent, so the
      # JVM-minted DB opens on device as if the device had built it). The
      # out dir IS the artifact — DB + completion marker + the adopt gate's
      # manifest, root-level in the artifact zip, exactly what
      # adoptPrebuiltIndex parses. Installing it replaces the
      # minutes-to-hours post-import address sweep with a copy.
      - name: Build search index
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          ./gradlew :lib:search:searchIndexCli \
            -Parchive="$GITHUB_WORKSPACE/out/atlas-$COUNTRY.pmtiles" \
            -Pout="$GITHUB_WORKSPACE/out/search" \
            -Pheap=4g

      - name: Show search index
        run: |
          # End-to-end proof the artifact is adoptable: the manifest names
          # this very archive, and the row counts are read back out of the
          # minted DB itself — through plain sqlite3, the same claim the
          # CLI's own reopen pass makes.
          cat "out/search/manifest.json"
          echo '---'
          python3 - <<'EOF'
          import glob, json, sqlite3, sys
          manifest = json.load(open("out/search/manifest.json"))
          db = glob.glob("out/search/search-*.db")
          assert len(db) == 1, f"expected one index DB, found {db}"
          con = sqlite3.connect(db[0])
          try:
              places = con.execute("SELECT COUNT(*) FROM place").fetchone()[0]
              addresses = con.execute("SELECT COUNT(*) FROM address").fetchone()[0]
          finally:
              con.close()
          assert places == manifest["places"], \
              f"place rows {places} != manifest {manifest['places']}"
          assert addresses == manifest["addresses"], \
              f"address rows {addresses} != manifest {manifest['addresses']}"
          print(f"search index verified: {places} places, {addresses} addresses")
          EOF

      - name: Upload search artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-search-${{ matrix.country }}
          # The index DB is dense binary SQLite; storing beats re-deflating.
          compression-level: 0
          retention-days: 7
          # Same dir-as-artifact trick as the routing segments.
          path: out/search/*
          if-no-files-found: error

  # The artifact sidebar is buried on the run page; put every artifact the
  # run produced (name, size, download link) in the run's Summary tab.
  summarize:
    needs: [countries]
    if: always()
    name: artifact summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Index artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/artifact-summary.py